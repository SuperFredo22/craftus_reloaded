name: Build Craftus 3DS
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 3DS libs
        # Das devkitARM-Image enthält 3ds-dev bereits; ein zeitweiliger
        # Ausfall des Paketservers (z.B. HTTP 403) darf den Build nicht stoppen.
        run: dkp-pacman -Sy --needed --noconfirm 3ds-dev || echo "pacman sync failed, relying on preinstalled libs"
      - name: Build
        run: make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: craftus-survie
          path: "*.3dsx"
          if-no-files-found: error
